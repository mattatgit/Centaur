[package]
name = "centaur-network"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
anyhow = "1"
fs2 = "0.4"
iroh = "=1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[profile.release]
strip = true
