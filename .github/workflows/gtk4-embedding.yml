name: GTK4 embedding experiment

on:
  push:
    branches: [codex/gtk4-migration]
    paths:
      - 'gtk4/**'
      - 'assets/branding/**'
      - 'packaging/gtk4-embedding-test.nix'
      - 'packaging/gtk4-test-seat.nix'
      - 'packaging/patches/casilda-*.patch'
      - 'tests/test_gtk4_backend.py'
      - 'tests/test_gtk4_viewport.py'
      - 'flake.nix'
      - 'flake.lock'
      - 'scripts/publish-binary-cache.sh'
      - 'scripts/check-gtk4-wayland.sh'
      - '.github/workflows/gtk4-embedding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtk4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: GTK4 viewport ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        if: vars.CENTAUR_CACHIX_CACHE != ''
        with:
          name: ${{ vars.CENTAUR_CACHIX_CACHE }}
          skipPush: true
      - name: Check Python, process isolation and workflow
        run: |
          python3 -m py_compile gtk4/embedding/*.py
          python3 -m unittest discover -s tests -p 'test_gtk4_*.py'
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck -c bash -c \
            'actionlint .github/workflows/gtk4-embedding.yml .github/workflows/native.yml && shellcheck scripts/publish-binary-cache.sh scripts/check-gtk4-wayland.sh'
      - name: Build isolated GTK4 experiment only
        run: nix build -L --no-update-lock-file .#gtk4-embedding-test -o result-gtk4
      - name: Exercise separate app in a disposable display
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gtk4-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          # The GTK stack is independently pinned; realise its D-Bus config
          # explicitly rather than relying on the tooling shell's older D-Bus.
          nix build --no-link .#gtk4-embedding-test.dbusForTests
          nix build .#gtk4-embedding-test.waylandTestSeat -o result-test-seat
          dbus_config=$(nix eval --raw .#gtk4-embedding-test.dbusConfig)
          nix shell --inputs-from . nixpkgs#sway nixpkgs#grim nixpkgs#dbus \
            -c dbus-run-session --config-file="$dbus_config" -- \
            timeout 180s bash scripts/check-gtk4-wayland.sh result-gtk4 "$RUNNER_TEMP/gtk4-evidence" result-test-seat/bin/centaur-test-seat
      - name: Save experiment evidence and limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtk4-phase1-aarch64-linux
          path: ${{ runner.temp }}/gtk4-evidence/
          if-no-files-found: ignore
      - name: Publish isolated test package after automated checks
        if: >-
          success() && github.repository == 'mattatgit/Centaur' &&
          github.ref == 'refs/heads/codex/gtk4-migration' &&
          vars.CENTAUR_CACHIX_CACHE != ''
        env:
          CENTAUR_CACHIX_CACHE: ${{ vars.CENTAUR_CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CENTAUR_PACKAGE_ATTRIBUTE: gtk4-embedding-test
        run: bash scripts/publish-binary-cache.sh result-gtk4 "$RUNNER_TEMP/gtk4-distribution" aarch64-linux "$GITHUB_SHA"
      - name: Save signed-cache metadata
        if: success() && vars.CENTAUR_CACHIX_CACHE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtk4-distribution-aarch64-linux
          path: ${{ runner.temp }}/gtk4-distribution/metadata/
          if-no-files-found: error
