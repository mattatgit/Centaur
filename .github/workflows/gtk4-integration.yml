name: GTK4 Centaur integration

on:
  push:
    branches: [main, 'codex/composer-collaboration', 'codex/agent-recovery']
    paths:
      - 'src/**'
      - 'integrations/figma/**'
      - 'packaging/figma-reader.nix'
      - 'gtk4/**'
      - 'templates/**'
      - 'assets/branding/**'
      - 'assets/figma/**'
      - 'packaging/centaur-app.svg'
      - 'packaging/gtk4-centaur.desktop'
      - 'tests/**'
      - 'packaging/gtk4-*.nix'
      - 'packaging/import-*.nix'
      - 'scripts/import-isolation/**'
      - 'packaging/patches/casilda-*.patch'
      - 'scripts/check-gtk4-wayland.sh'
      - 'scripts/check-gtk4-gnome-launcher.py'
      - 'scripts/publish-binary-cache.sh'
      - 'scripts/publish-gtk4-update.py'
      - 'CMakeLists.txt'
      - 'flake.*'
      - '.github/workflows/gtk4-integration.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtk4-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: GTK4 product and service regressions (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-linux
            runner: ubuntu-24.04
    # A cold runner can spend over 20 minutes fetching Qt and Rust before the native checks.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        if: vars.CENTAUR_CACHIX_CACHE != ''
        with:
          name: ${{ vars.CENTAUR_CACHIX_CACHE }}
          skipPush: true
      - name: Check Python, bundle contract and workflow
        run: |
          node --test tests/figma-reader.test.cjs
          python3 -m py_compile gtk4/embedding/*.py scripts/publish-gtk4-update.py
          python3 -m unittest discover -s tests -p 'test_gtk4_*.py'
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck -c bash -c \
            'actionlint && shellcheck scripts/publish-binary-cache.sh scripts/check-gtk4-wayland.sh'
      - name: Build retained service and run core, network and Iroh regressions
        run: nix build -L --no-update-lock-file .#gtk4-preview.services -o result-services
      - name: Cache service only after its regressions pass
        if: success() && github.ref == 'refs/heads/main' && vars.CENTAUR_CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CENTAUR_CACHIX_CACHE: ${{ vars.CENTAUR_CACHIX_CACHE }}
        run: nix shell --inputs-from . nixpkgs#cachix -c cachix push "$CENTAUR_CACHIX_CACHE" "$(realpath result-services)"
      - name: Build GTK4 development frontend
        run: |
          nix build -L --no-update-lock-file .#gtk4-preview -o result-gtk4
          nix build -L --no-update-lock-file .#gtk4-preview.updaterPrevious -o result-updater-previous
      - name: Read the published manifest for the uncached transfer check
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ matrix.system == 'aarch64-linux' && 'gtk4-preview' || 'gtk4-preview-x86_64-linux' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" |
            jq -e --arg tag "$RELEASE_TAG" 'select(.tag_name == $tag and .draft == false and .prerelease == true) | .body | fromjson' \
              > "$RUNNER_TEMP/gtk4-published-manifest.json"
      - name: Native embedding, scaling, capture and two-profile GTK4 integration
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          CENTAUR_GTK4_PRODUCT: '1'
          CENTAUR_CHECK_SIGNED_TRANSFER: ${{ github.ref != 'refs/heads/main' && '1' || '0' }}
          CENTAUR_TRANSFER_MANIFEST: ${{ runner.temp }}/gtk4-published-manifest.json
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gtk4-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          nix build --no-link .#gtk4-preview.dbusForTests
          nix build .#gtk4-preview.waylandTestSeat -o result-test-seat
          dbus_config=$(nix eval --raw .#gtk4-preview.dbusConfig)
          nix shell --inputs-from . nixpkgs#sway nixpkgs#grim nixpkgs#dbus nixpkgs#git nixpkgs#wl-clipboard \
            -c dbus-run-session --config-file="$dbus_config" -- \
            timeout 720s bash scripts/check-gtk4-wayland.sh result-gtk4 "$RUNNER_TEMP/gtk4-integration-evidence" result-test-seat/bin/centaur-test-seat
      - name: Save native screenshots, reports and limitations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtk4-integration-${{ matrix.system }}
          path: ${{ runner.temp }}/gtk4-integration-evidence/
          if-no-files-found: ignore
      - name: Publish GTK4 development preview after successful checks
        if: >-
          success() && github.repository == 'mattatgit/Centaur' &&
          github.ref == 'refs/heads/main' &&
          vars.CENTAUR_CACHIX_CACHE != ''
        env:
          CENTAUR_CACHIX_CACHE: ${{ vars.CENTAUR_CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CENTAUR_PACKAGE_ATTRIBUTE: gtk4-preview
        run: bash scripts/publish-binary-cache.sh result-gtk4 "$RUNNER_TEMP/gtk4-distribution" '${{ matrix.system }}' "$GITHUB_SHA"
      - name: Save signed-cache metadata
        if: success() && github.ref == 'refs/heads/main' && vars.CENTAUR_CACHIX_CACHE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtk4-product-distribution-${{ matrix.system }}
          path: ${{ runner.temp }}/gtk4-distribution/metadata/
          if-no-files-found: error
      - name: Exercise Settings update against the published signed package
        if: success() && github.ref == 'refs/heads/main' && vars.CENTAUR_CACHIX_CACHE != ''
        env:
          GTK_A11Y: none
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          CENTAUR_GTK4_UPDATER: '1'
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/gtk4-update-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          CENTAUR_UPDATER_PREVIOUS=$(realpath result-updater-previous)
          export CENTAUR_UPDATER_PREVIOUS
          export CENTAUR_UPDATER_MANIFEST="$RUNNER_TEMP/gtk4-distribution/metadata/manifest.json"
          dbus_config=$(nix eval --raw .#gtk4-preview.dbusConfig)
          nix shell --inputs-from . nixpkgs#sway nixpkgs#grim nixpkgs#dbus nixpkgs#git nixpkgs#wl-clipboard \
            -c dbus-run-session --config-file="$dbus_config" -- \
            timeout 300s bash scripts/check-gtk4-wayland.sh result-gtk4 "$RUNNER_TEMP/gtk4-update-evidence" result-test-seat/bin/centaur-test-seat
      - name: Relaunch the updated profile in the same GNOME Shell session
        if: success() && github.ref == 'refs/heads/main' && vars.CENTAUR_CACHIX_CACHE != ''
        run: |
          # A stalled regional runner mirror can exhaust the job before GNOME starts.
          mirror=https://archive.ubuntu.com/ubuntu
          if [[ $(dpkg --print-architecture) == arm64 ]]; then mirror=https://ports.ubuntu.com/ubuntu-ports; fi
          sources="$RUNNER_TEMP/gnome-packages.list"
          for suite in noble noble-updates noble-security; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $mirror $suite main universe" >> "$sources"
          done
          apt_options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=- -o Acquire::https::Timeout=20 -o Acquire::Retries=2)
          sudo apt-get "${apt_options[@]}" update -q
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends gnome-shell libgl1-mesa-dri
          dbus-run-session -- timeout 160s python3 scripts/check-gtk4-gnome-launcher.py \
            result-updater-previous result-gtk4 "${GITHUB_SHA::7}" "$RUNNER_TEMP/gtk4-update-evidence/gnome-relaunch"
      - name: Save updater screenshots and transaction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gtk4-updater-${{ matrix.system }}
          path: ${{ runner.temp }}/gtk4-update-evidence/
          if-no-files-found: ignore
  advertise:
    name: Advertise both verified GTK4 previews
    needs: integration
    if: >-
      github.repository == 'mattatgit/Centaur' &&
      github.ref == 'refs/heads/main' &&
      vars.CENTAUR_CACHIX_CACHE != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gtk4-product-distribution-*
          path: ${{ runner.temp }}/verified-gtk4
      - name: Advertise the verified in-app update
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/publish-gtk4-update.py
          "$RUNNER_TEMP/verified-gtk4/gtk4-product-distribution-aarch64-linux/manifest.json"
          "$RUNNER_TEMP/verified-gtk4/gtk4-product-distribution-x86_64-linux/manifest.json"
